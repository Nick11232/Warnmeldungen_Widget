<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=348,height=710,user-scalable=no">
<title>Östringen DWD Dashboard</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:348px;
    height:500px;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background-image:url("https://i.ibb.co/Jj5VHVzY/Vorlage-Divera-Ticker-5.png");
    background-size:100% 100%;
    background-repeat:no-repeat;
    background-position:center;
    background-color:transparent;
}

#container{
    width:348px;
    height:500px;
    padding:4px;
    display:flex;
    flex-direction:column;
    gap:2px;
}

.card{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(4px);

    border:1px solid rgba(255,255,255,0.25);
    border-radius:10px;

    box-shadow:0 2px 8px rgba(0,0,0,.35);
    color:white;
}

.cardHeader{
    background:linear-gradient(
        90deg,
        #002654 0%,
        #003f88 100%
    );

    color:white;
    font-size:14px;
    font-weight:bold;

    padding:8px 10px;

    border-bottom:1px solid rgba(255,255,255,.15);
	
	border-radius:10px 10px 0 0;

    text-transform:uppercase;
}

#warningCard{
    height:250px;
    padding:0;
}

#warnings{
    padding:8px;
    height:130px;
    overflow:hidden;
}

.warning{
    background:rgba(0,0,0,0.35);

    border:1px solid #d8d8d8;
    border-left:5px solid #d60000;

    border-radius:8px;

    padding:8px;
    margin-bottom:6px;
}

.warning h3{
    color:white;
    font-size:14px;
    font-weight:bold;
    margin-bottom:4px;
}

.warning p{
    color:white;
    font-size:11px;
}

.noWarning{
    background:white;

    border:1px solid #d8d8d8;
    border-left:5px solid #008000;

    border-radius:8px;

    padding:10px;

    color:#003366;
    text-align:center;
    font-weight:bold;
}

#grassCard{
    flex:1;
    padding:0;
}

#grassfire{
    width:100%;
    height:275px;
    object-fit:contain;
}

.footer{
    text-align:center;
    color:white;
    font-size:9px;
}
</style>
</head>

<body>

<div id="container">

    <!-- WARNUNGEN -->
   <div class="card" id="warningCard">

    <div class="cardHeader">
        <span>AMTLICHE WARNUNGEN</span>
    </div>

    <div id="warnings">
        Lade Warnungen...
    </div>

</div>

    <!-- GLFI -->
    <div class="card" id="grassCard">

    <div class="cardHeader">
        <span>GRASLANDFEUERINDEX</span>
    </div>

    <img id="grassfire"
         src="https://www.wettergefahren.de/DWD/warnungen/agrar/glfi/glfi_stationen.png?0"
         alt="Graslandfeuerindex">

</div>

    <div class="footer">
        Aktualisierung alle 5 Minuten | Quelle: Deutscher Wetterdienst (DWD)
    </div>

</div>

<script>

const REFRESH_INTERVAL = 300000;

/* WARNUNGEN */
async function loadWarnings(){

    const target = document.getElementById("warnings");

    try{

        const response = await fetch(
            "https://www.dwd.de/DWD/warnungen/warnapp_gemeinden/json/warnings_gemeinde_baw.html"
        );

        const html = await response.text();

        const parser = new DOMParser();
        const doc = parser.parseFromString(html,"text/html");

        const city = doc.querySelector('h2[id="Stadt Östringen"]');

        if(!city){
            target.innerHTML = '<div class="noWarning">AKTUELL KEINE WARNUNGEN</div>';
            return;
        }

        const table = city.nextElementSibling;

        if(!table){
            target.innerHTML = '<div class="noWarning">KEINE WARNUNGEN</div>';
            return;
        }

        let htmlOut = "";

        table.querySelectorAll("tr").forEach((row,index)=>{

            if(index===0) return;

            const cols = row.querySelectorAll("td");
            if(cols.length < 4) return;

            htmlOut += `
                <div class="warning">
                    <h3>${cols[0].innerText}</h3>
                    <p>${cols[1].innerText} → ${cols[2].innerText}</p>
                </div>
            `;
        });

        target.innerHTML = htmlOut || '<div class="noWarning">KEINE WARNUNGEN</div>';

    } catch(e){
        target.innerHTML =
            '<div class="warning"><h3>Fehler</h3><p>Daten nicht verfügbar</p></div>';
    }
}

function refreshAll(){
    loadWarnings();

    const img = document.getElementById("grassfire");
    img.src = "https://www.wettergefahren.de/DWD/warnungen/agrar/glfi/glfi_stationen.png?0" + Date.now();
}

refreshAll();
setInterval(refreshAll, REFRESH_INTERVAL);

</script>

</body>
</html>
