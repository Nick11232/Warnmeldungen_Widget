<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=348,height=710,user-scalable=no">
<title>Östringen Wetterdashboard</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:348px;
    height:500px;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background-image:url("https://i.ibb.co/Jj5VHVzY/Vorlage-Divera-Ticker-5.png");
    background-size:100% 100%;
    background-repeat:no-repeat;
    background-position:center;
    background-color:transparent;
}

#container{
    width:348px;
    height:500px;
    padding:4px;
    display:flex;
    flex-direction:column;
    gap:2px;
}

.card{
    background: linear-gradient(
        180deg,
        rgba(0, 35, 80, 0.85) 0%,
        rgba(0, 60, 130, 0.70) 100%
    );
    border-radius:6px;
    padding:8px;
    box-shadow:0 2px 8px rgba(0,0,0,.35);
    color:white;
}

/* WARNUNGEN */
#warningCard{
    height:250px;
    overflow:hidden;
    background-color:transparent;
}

.sectionTitle{
    font-size:14px;
}

#warnings{
    height:220px;
    overflow:hidden;
}

.warning{
    border-left:4px solid #d60000;
    padding:6px;
    margin-bottom:6px;
    border-radius:4px;
    background:rgba(0,0,0,0.35);
}

.warning h3{
    font-size:16px;
    color:white;
    margin-bottom:4px;
}

.warning p{
    font-size:12px;
    color:white;
    line-height:1.3;
}

.noWarning{
    text-align:center;
    color:White;
    font-weight:bold;
    font-size:16px;
	border-left:4px solid #d60000;
    padding:6px;
    margin-bottom:6px;
    border-radius:4px;
    background:rgba(0,0,0,0.35);
}

/* GLFI */
#grassCard{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:#0050A073;   /* gleiche Optik wie Warnungen */
    border-radius:6px;
    padding:8px;
    box-shadow:0 1px 3px rgba(0,0,0,.2);
}

#grassfire{
    width:100%;
    height:270px;
    object-fit:contain;
}

.footer{
    text-align:center;
    font-size:9px;
    color:#666;
}
</style>
</head>

<body>

<div id="container">

    <!-- WARNUNGEN -->
    <div class="card" id="warningCard">
        <div id="warnings">Lade Warnungen...</div>
    </div>

    <!-- GLFI -->
    <div class="card" id="grassCard">
        <img id="grassfire"
             src="https://www.wettergefahren.de/DWD/warnungen/agrar/glfi/glfi_stationen.png?0"
             alt="Graslandfeuerindex">
    </div>

    <div class="footer">
        Aktualisierung alle 5 Minuten
    </div>

</div>

<script>

const REFRESH_INTERVAL = 300000;

/* WARNUNGEN */
async function loadWarnings(){

    const target = document.getElementById("warnings");

    try{

        const response = await fetch(
            "https://www.dwd.de/DWD/warnungen/warnapp_gemeinden/json/warnings_gemeinde_baw.html"
        );

        const html = await response.text();

        const parser = new DOMParser();
        const doc = parser.parseFromString(html,"text/html");

        const city = doc.querySelector('h2[id="Stadt Östringen"]');

        if(!city){
            target.innerHTML = '<div class="noWarning">KEINE WARNUNGEN</div>';
            return;
        }

        const table = city.nextElementSibling;

        if(!table){
            target.innerHTML = '<div class="noWarning">KEINE WARNUNGEN</div>';
            return;
        }

        let htmlOut = "";

        table.querySelectorAll("tr").forEach((row,index)=>{

            if(index===0) return;

            const cols = row.querySelectorAll("td");
            if(cols.length < 4) return;

            htmlOut += `
                <div class="warning">
                    <h3>${cols[0].innerText}</h3>
                    <p>${cols[1].innerText} → ${cols[2].innerText}</p>
                </div>
            `;
        });

        target.innerHTML = htmlOut || '<div class="noWarning">AKTUELL KEINE WARNUNGEN</div>';

    } catch(e){
        target.innerHTML =
            '<div class="warning"><h3>Fehler</h3><p>Daten nicht verfügbar</p></div>';
    }
}

function refreshAll(){
    loadWarnings();

    const img = document.getElementById("grassfire");
    img.src = "https://www.wettergefahren.de/DWD/warnungen/agrar/glfi/glfi_stationen.png?0" + Date.now();
}

refreshAll();
setInterval(refreshAll, REFRESH_INTERVAL);

</script>

</body>
</html>
