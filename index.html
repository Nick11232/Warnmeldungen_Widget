<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=348,height=710,user-scalable=no">
<title>Östringen Wetterdashboard</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:348px;
    height:500px;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background-image:url("https://i.ibb.co/Jj5VHVzY/Vorlage-Divera-Ticker-5.png");
    background-size:100% 100%;
    background-repeat:no-repeat;
    background-position:center;
    background-color:transparent;
}

#container{
    width:348px;
    height:500px;
    padding:4px;
    display:flex;
    flex-direction:column;
    gap:4px;
}

.card{
    background:#ffffff;
    border-radius:6px;
    padding:6px;
    box-shadow:0 1px 3px rgba(0,0,0,.2);
}

.header{
    text-align:center;
    height:10px;
	    background-color:transparent;
}

.header h1{
    font-size:0px;
    color:#003366;
}


/* WARNUNGEN */

#warningCard{
    height:250px;
    overflow:hidden;
	background-color:transparent;
}

.sectionTitle{
    font-size:14px;
    margin-bottom:4px;
    color:#ffffff;
}

#warnings{
    height:220px;
    overflow-y:auto;
}

.warning{
    border-left:4px solid #d60000;
    background:#ffffff;
    padding:4px;
    margin-bottom:4px;
    border-radius:4px;
	background-color:transparent;
}

.warning h3{
    font-size:16px;
	color:white;
    margin-bottom:2px;
}

.warning p{
    font-size:10px;
	color:white;
    line-height:1.2;
}

.noWarning{
    text-align:center;
    color:green;
    font-weight:bold;
    font-size:18px;
    margin-top:70px;
}

/* WARNKARTE */

#mapCard{
    height:0px;
	background-color:transparent;
}

#warnMap{
    width:100%;
    height:180px;
    object-fit:contain;
}

/* GRASLANDFEUERINDEX */

#grassCard{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

#grassValue{
    text-align:center;
    font-size:70px;
    font-weight:bold;
    line-height:1;
}

#grassText{
    text-align:center;
    font-size:16px;
    margin-top:8px;
}

#grassLocation{
    text-align:center;
    font-size:11px;
    margin-top:8px;
    color:#666;
}

/* GLFI Farben */

.level1{color:#008000;}
.level2{color:#a0b000;}
.level3{color:#ff9900;}
.level4{color:#ff3300;}
.level5{color:#990000;}

.footer{
    text-align:center;
    font-size:9px;
    color:#666;
}
</style>
</head>
<body>

<div id="container">

    <div class="card" id="warningCard">
        <div class="sectionTitle">
            
        </div>
        
<div class="card header">
    <h1></h1>
</div>
        <div id="warnings">
            Lade Warnungen...
        </div>
    </div>

    <div class="card" id="mapCard">
        <div class="sectionTitle">
            
        </div>

        <!-- Eigene Karte einsetzen -->
        <img
            id="warnMap"
            src="https://www.dwd.de/DWD/warnungen/warnapp_gemeinden/json/warnungen_gemeinde_map_de.png"
            alt="Warnkarte">
    </div>

    <div class="card" id="grassCard">

        <div class="sectionTitle">
            Graslandfeuerindex
        </div>

        <div id="grassValue" class="level1">
            1
        </div>

        <div id="grassText">
            Sehr geringe Gefahr
        </div>

        <div id="grassLocation">
            Östringen / Landkreis Karlsruhe
        </div>

    </div>

    <div class="footer">
        Aktualisierung alle 5 Minuten
    </div>

</div>

<script>

const REFRESH_INTERVAL = 300000;



// Warnungen

async function loadWarnings(){

    const target =
        document.getElementById("warnings");

    try{

        const response = await fetch(
            "https://www.dwd.de/DWD/warnungen/warnapp/json/warnings.json"
        );

        let text =
            await response.text();

        text = text
            .replace(/^warnWetter\.loadWarnings\(/,"")
            .replace(/\);$/,"");

        const data =
            JSON.parse(text);

        let html = "";

        Object.values(data.warnings)
        .forEach(region => {

            region.forEach(warn => {

                const name =
                    (warn.regionName || "")
                    .toLowerCase();

                if(
                    name.includes("karlsruhe")
                ){

                    html += `
                    <div class="warning">
                        <h3>${warn.headline}</h3>
                        <p>${warn.description || ""}</p>
                    </div>`;
                }

            });

        });

        if(html === ""){

            html =
            '<div class="noWarning">' +
            'KEINE WARNUNGEN' +
            '</div>';

        }

        target.innerHTML = html;

    }
    catch(e){

        target.innerHTML =
        '<div class="warning">' +
        '<h3>DWD nicht erreichbar</h3>' +
        '<p>CORS-Sperre oder Netzwerkfehler.</p>' +
        '</div>';

    }

}

// Graslandfeuerindex
// HIER SPÄTER ECHTE DATEN EINBINDEN

function loadGrassfire(){

    const level = 112;

    const value =
        document.getElementById("grassValue");

    const text =
        document.getElementById("grassText");

    value.className =
        "level" + level;

    value.innerHTML =
        level;

    switch(level){

        case 1:
            text.innerHTML =
            "Sehr geringe Gefahr";
            break;

        case 2:
            text.innerHTML =
            "Geringe Gefahr";
            break;

        case 3:
            text.innerHTML =
            "Mittlere Gefahr";
            break;

        case 4:
            text.innerHTML =
            "Hohe Gefahr";
            break;

        case 5:
            text.innerHTML =
            "Sehr hohe Gefahr";
            break;
			
		case 112:
            text.innerHTML =
            "In Arbeit";
            break;	
			
    }
}

// Karten neu laden

function refreshMap(){

    const map =
        document.getElementById("warnMap");

    map.src =
        "https://www.dwd.de/DWD/warnungen/warnapp_gemeinden/json/warnungen_gemeinde_map_de.png?t=" +
        Date.now();
}

// Alles aktualisieren

async function refreshAll(){



    await loadWarnings();

    loadGrassfire();

    refreshMap();
}

// Start

refreshAll();

setInterval(
    refreshAll,
    REFRESH_INTERVAL
);

setInterval(
    updateClock,
    1000
);

</script>

</body>
</html>
